<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 1rem 0;
    }

    .container {
      width: 90%;
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
      text-align: center;
      padding: 15px;
    }

    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product h3 {
      margin: 10px 0;
    }

    .product p {
      font-size: 1.1em;
      color: #555;
    }

    button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #218838;
    }

    #cart {
      margin: 20px auto;
      width: 90%;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <header>
    <h1>Simple Store</h1>
  </header>

  <div class="container" id="product-list">
    <!-- Products will be inserted here by JS -->
  </div>

  <div id="cart">
    <h2>🛒 Cart</h2>
    <ul id="cart-items"></ul>
    <p><strong>Total:</strong> $<span id="total">0.00</span></p>
  </div>

  <script>
    const products = [
      { id: 1, name: "T-Shirt", price: 15.99, image: "https://via.placeholder.com/200x150" },
      { id: 2, name: "Sneakers", price: 49.99, image: "https://via.placeholder.com/200x150" },
      { id: 3, name: "Hat", price: 9.99, image: "https://via.placeholder.com/200x150" },
      { id: 4, name: "Jeans", price: 39.99, image: "https://via.placeholder.com/200x150" }
    ];

    const productList = document.getElementById("product-list");
    const cartItems = document.getElementById("cart-items");
    const totalDisplay = document.getElementById("total");

    let total = 0;

    function renderProducts() {
      products.forEach(p => {
        const div = document.createElement("div");
        div.className = "product";
        div.innerHTML = `
          <img src="${p.image}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p>$${p.price.toFixed(2)}</p>
          <button onclick="addToCart(${p.id})">Add to Cart</button>
        `;
        productList.appendChild(div);
      });
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const li = document.createElement("li");
      li.textContent = `${product.name} - $${product.price.toFixed(2)}`;
      cartItems.appendChild(li);

      total += product.price;
      totalDisplay.textContent = total.toFixed(2);
    }

    renderProducts();
  </script>
</body>
</html>
